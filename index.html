<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex Diary</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-gold: #c6a24a;
        --color-cream: #fbf6e9;
        --color-cardcream: #f6ecc9;
        --color-red: #c0272d;
        --color-redlt: #d8474d;
        --color-forest: #1e3a2b;
        --font-display: "Bungee", sans-serif;
        --font-name: "Baloo 2", sans-serif;
        --font-body: "Nunito", sans-serif;
      }
    </style>
  </head>
  <body>
    <header
      class="bg-(--color-cardcream) flex flex-row justify-between items-center pt-4 pb-4 pr-4 pl-8 border-b-2 border-gold"
    >
      <div class="text-2xl font-display text-(--color-red)">POKÉDEX DIARY</div>
      <nav>
        <ul class="flex gap-6 font-name">
          <li
            class="hover:text-(--color-red) pb-1 border-b-2 border-transparent hover:border-(--color-red)"
          >
            <a href="index.html">Homepage</a>
          </li>
          <li
            class="hover:text-(--color-red) pb-1 border-b-2 border-transparent hover:border-(--color-red)"
          >
            <a href="pokedex.html">Pokédex</a>
          </li>
        </ul>
      </nav>
    </header>
    <!-- header + nav bar with two elements -->
    <!-- heading with a p-->
    <!-- search bar -->
    <main><section class="p-8">
      <div id="pokemon-grid" class="grid grid-cols-4 gap-6"></div>
      <template id="pokemon-card-template">
        <div class="bg-(--color-cardcream) border-2 border-(--color-gold) rounded-2xl p-4">
            <p class="text-xs" data-id></p>
          <img class="w-full"/>
          <p class="font-name text-lg" data-name></p>
          <p class="font-body text-xs pb-3" data-stats></p>
          <button data-catch-btn class="bg-gold text-forest w-full py-1 rounded-full text-sm">Catch!</button>
        </div>
      </template>
      <button id="load-more-btn" class="mt-6 mx-auto block bg-red text-cream px-6 py-2 rounded-full font-name">Load More</button>
    </section>
    </main><!-- cards  -->
    <!-- footer -->
    <script src="./src/main.js"></script>
  </body>
</html>
