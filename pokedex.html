<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Pokédex</title>
    <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="p-6 md:p-12 max-w-5xl mx-auto">
  <div class="page-frame">

    <!-- navbar -->
    <header class="bg-cardcream flex flex-row justify-between items-center pt-4 pb-4 pr-8 pl-8 border-b-2 border-gold">
      <div class="text-2xl font-display text-red">POKÉDEX DIARY</div>
      <nav>
        <ul class="flex gap-6 font-name">
          <li class="hover:text-red pb-1 border-b-2 border-transparent hover:border-red">
            <a href="index.html">Homepage</a>
          </li>
          <li class="text-red pb-1 border-b-2 border-red">
            <a href="pokedex.html">Pokédex</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="p-8 space-y-8">

      <!-- heading -->
      <div class="flex items-center justify-between">
        <h1 class="font-display text-xl md:text-2xl text-red">My Pokédex</h1>
        <span id="caughtCount" class="font-name text-sm font-bold text-forest/60">0 caught</span>
      </div>

      <!-- favourite cards with notes -->
      <section id="pokedexGrid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <!-- pokemon-card.js populates this grid at runtime -->
      </section>

      <!-- empty state, hidden unless the caught list is empty -->
      <div id="emptyState" class="card p-8 text-center space-y-1 hidden" style="border-style: dashed;">
        <p class="font-name text-base font-extrabold text-forest/70">Your Pokédex is empty!</p>
        <p class="text-xs text-forest/50 font-semibold">Catch a Pokémon on the Homepage to start your collection.</p>
      </div>

    </main>

    <!-- footer -->
    <footer class="border-t-2 border-gold px-8 py-4 text-center">
      <p class="text-[11px] font-body font-semibold text-forest/40">Pokédex Diary &middot; Data via PokéAPI</p>
    </footer>

  </div>

  <script src="./src/pokemon-storage.js"></script>
  <script src="./src/pokemon-card.js"></script>
  <script src="./src/pokedex.js"></script>
</body>
</html>
